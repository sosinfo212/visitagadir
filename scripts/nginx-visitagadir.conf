server {
    server_name visitagadir.info www.visitagadir.info;

    # Canonicalise www -> apex (fires once the www DNS record points here).
    if ($host = www.visitagadir.info) {
        return 301 https://visitagadir.info$request_uri;
    }

    client_max_body_size 25M;

    # Security headers (applied to proxied app responses).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text responses (HTML/JS/CSS/JSON/SVG). Images are already
    # compressed formats — excluded.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # User uploads — served by nginx (Next.js standalone does not serve runtime public files)
    location /uploads/ {
        alias /var/www/visitagadir/public/uploads/;
        # Upload filenames are unique + never overwritten -> safe to cache 1y immutable.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/visitagadir.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visitagadir.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.visitagadir.info) {
        return 301 https://$host$request_uri;
    }

    if ($host = visitagadir.info) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name visitagadir.info www.visitagadir.info;
    return 404;
}
